# ── Korbaj (كرباج) for Hyprland — reference only ───────────────────────────
# Easiest: run `node bin/korbaj.js setup` (or `npm run setup`). It writes
# ~/.config/hypr/korbaj.conf with absolute paths and sources it for you.
#
# To do it by hand instead, copy the binds below into your config.
# They use physical key codes (code:NN) so they keep working when your
# keyboard layout is not English — with an Arabic layout the "W" key is ص.
# Replace /usr/bin/node and the path with the output of `which node` and
# the real location of this folder.

$korbaj = /usr/bin/node /home/YOU/Korbaj/bin/korbaj.js

bind = ALT, code:25, exec, $korbaj toggle        # Alt+W  summon / hide
bind = ALT, code:54, exec, $korbaj passive       # Alt+C  click-through <-> active
bind = ALT, code:10, exec, $korbaj mode 1        # Alt+1  single whip
bind = ALT, code:11, exec, $korbaj mode 2        # Alt+2  dual whips
bind = ALT, code:12, exec, $korbaj mode 3        # Alt+3  pat mode
bind = ALT, code:39, exec, $korbaj skin          # Alt+S  next skin
bind = ALT SHIFT, code:24, exec, $korbaj quit    # Alt+Shift+Q  quit

# No window rules needed: Korbaj makes its own window floating, pinned and
# click-through at runtime over Hyprland's IPC.
