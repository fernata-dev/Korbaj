# ── Korbaj (كرباج) for Hyprland ─────────────────────────────────────────────
# Add to ~/.config/hypr/hyprland.conf:   source = ~/Korbaj/extras/hyprland.conf
#
# Why: Wayland doesn't let apps grab global keys, so Hyprland itself runs the
# korbaj control command. Korbaj already makes its own window floating + pinned
# + click-through at runtime; the window rules below just make it instant.

$korbaj = node ~/Korbaj/bin/korbaj.js
# If node comes from nvm/fnm and Hyprland can't find it, use its full path, e.g.:
# $korbaj = ~/.nvm/versions/node/v22.0.0/bin/node ~/Korbaj/bin/korbaj.js

bind = ALT, W, exec, $korbaj toggle      # summon / hide (starts it if not running)
bind = ALT, C, exec, $korbaj passive     # click-through ↔ active
bind = ALT, 1, exec, $korbaj mode 1      # single whip
bind = ALT, 2, exec, $korbaj mode 2      # dual whips
bind = ALT, 3, exec, $korbaj mode 3      # pat mode
bind = ALT, S, exec, $korbaj skin        # next skin (leather → obsidian → ivory)
bind = ALT SHIFT, Q, exec, $korbaj quit  # quit (Shift so it can't clash with app shortcuts)

# On Hyprland ≥ 0.48 you can write `windowrule` instead of `windowrulev2`.
windowrulev2 = float, title:^(Korbaj Overlay)$
windowrulev2 = pin, title:^(Korbaj Overlay)$
windowrulev2 = noborder, title:^(Korbaj Overlay)$
windowrulev2 = noshadow, title:^(Korbaj Overlay)$
windowrulev2 = noblur, title:^(Korbaj Overlay)$
windowrulev2 = noanim, title:^(Korbaj Overlay)$
windowrulev2 = noinitialfocus, title:^(Korbaj Overlay)$
